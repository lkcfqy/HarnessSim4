[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "harnessbench-insert"
version = "0.2.0"
description = "HarnessSim4: a topology-aware simulation benchmark for wire-harness robotics."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "HarnessBench-Insert contributors"},
]
dependencies = [
  "numpy>=1.24",
  "Pillow>=10",
  "pyarrow>=15",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]
high-fidelity = [
  "mujoco==3.12.0",
]
learning = [
  "torch>=2.10,<3",
]
visual = [
  "imageio-ffmpeg>=0.6,<0.7",
]
paper = [
  "pypdf>=5,<7",
]

[project.scripts]
harnessbench = "harnessbench.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
